# Accounts are provisioned at container start (see ../entrypoint.sh)
# from env vars — passwords never get committed. Usernames below are fixed
# by convention to match acl.conf; if you rename them, update acl.conf too.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
