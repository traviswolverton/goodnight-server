# Topic ACLs. No default/pattern rules on purpose — everything not listed
# for a user is denied. Two accounts:
#
# aggregator: this service. Writes the status/alert topics; reads
# homelab/action (the display asking for an Action, app/actions.py) and
# replies on homelab/action/result.
user aggregator
topic write homelab/status
topic write homelab/alert/camera
topic read homelab/action
topic write homelab/action/result

# esp32-client: the desk dashboard. Read-only except for one topic: it
# publishes an Action's id to homelab/action. That's all it can do — the
# server only runs actions already listed in config/actions.yaml, and the
# Home Assistant token never leaves the server (DESIGN.md "Actions").
user esp32-client
topic read homelab/status
topic read homelab/alert/camera
topic write homelab/action
topic read homelab/action/result
