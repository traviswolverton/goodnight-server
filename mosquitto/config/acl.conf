# Topic ACLs. No default/pattern rules on purpose — everything not listed
# for a user is denied. Two accounts (usernames fixed here; see
# ../entrypoint.sh and .env.example). Used by the bundled broker only
# (local-mqtt profile); on the central broker, docs/mqtt-broker.md.
#
# bedside-aggregator: this service. Writes the status/alert topics and the
# device's settings; reads what the device reports and its Action
# requests (app/actions.py, app/device.py); announces the device to Home
# Assistant via MQTT discovery.
user bedside-aggregator
topic write bedside/status
topic write bedside/alert/camera
topic read bedside/action
topic write bedside/action/result
topic write bedside/config
topic write bedside/sound
topic read bedside/sensors
topic read bedside/button
topic read bedside/availability
topic write homeassistant/sensor/bedside_dashboard/#
topic write homeassistant/device_automation/bedside_dashboard/#

# bedside-esp32: the nightstand device. Reads what to show and its
# settings; writes only its own reports. A button press carries a number,
# never an instruction — what it does is decided server-side (or by a Home
# Assistant automation), so this login can't make anything happen that
# isn't already configured.
user bedside-esp32
topic read bedside/status
topic read bedside/config
topic read bedside/sound
topic write bedside/sensors
topic write bedside/button
topic write bedside/availability
topic write bedside/action
topic read bedside/action/result
